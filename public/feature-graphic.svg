<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Background Gradient: Deep Slate & Twilight River -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="55%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#031826" />
    </linearGradient>

    <!-- Radar Sweep Glow -->
    <radialGradient id="radarGlow" cx="72%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Depth Contour Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Drop Shadow -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="neonOrangeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f97316" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)" />

  <!-- Tactical Grid Layer -->
  <rect width="1024" height="500" fill="url(#gridPattern)" />

  <!-- Bathymetric River Depth Contour Lines -->
  <g fill="none" stroke="#0ea5e9" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M 450,0 Q 520,120 620,160 T 780,240 T 940,320 T 1024,340" />
    <path d="M 500,0 Q 580,140 700,200 T 880,310 T 1024,390" stroke-width="1.8" stroke-dasharray="8 6" />
    <path d="M 560,0 Q 640,160 760,240 T 940,380 T 1024,450" stroke-width="1.2" />
    <path d="M 640,0 Q 720,190 850,290 T 1024,490" stroke-width="1.5" />
  </g>

  <!-- Sonar Radar Rings (Right Side) -->
  <circle cx="780" cy="250" r="190" fill="url(#radarGlow)" />
  <circle cx="780" cy="250" r="220" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="780" cy="250" r="160" fill="none" stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1.5" />
  <circle cx="780" cy="250" r="100" fill="none" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="780" cy="250" r="40" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- Sonar Coordinate Crosshairs -->
  <line x1="550" y1="250" x2="1010" y2="250" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="6 4" />
  <line x1="780" y1="20" x2="780" y2="480" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Tactical GPS Waypoint Pins on Map -->
  <g transform="translate(860, 160)">
    <circle cx="0" cy="0" r="14" fill="#f97316" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="6" fill="#f97316" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
    <text x="12" y="4" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">WP: WING DAM (42 LB)</text>
  </g>
  <g transform="translate(680, 340)">
    <circle cx="0" cy="0" r="12" fill="#06b6d4" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="5" fill="#06b6d4" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
    <text x="12" y="4" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700">BAIT SPOT (SHAD EDDY)</text>
  </g>

  <!-- Right Visual Emblem: Circular BIGGUY_littleboat Crest (Scaled & Styled) -->
  <g transform="translate(670, 140) scale(0.42)" filter="url(#shadowGlow)">
    <!-- Outer Rings -->
    <circle cx="256" cy="256" r="250" fill="#0f172a" stroke="#f97316" stroke-width="12" />
    <circle cx="256" cy="256" r="236" fill="none" stroke="#334155" stroke-width="8" />

    <!-- Center Art: Boat, Rod, Angler & Monster Catfish -->
    <!-- Water Waves -->
    <path d="M 90 325 Q 135 308 180 325 T 270 325 T 360 325 T 420 325" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 110 350 Q 160 332 210 350 T 310 350 T 405 350" stroke="#0284c7" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 140 372 Q 195 358 255 372 T 370 372" stroke="#0369a1" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Motor & Hull -->
    <path d="M 100 290 L 115 290 L 112 316 L 98 316 Z" fill="#ffffff" />
    <path d="M 95 282 C 95 277 100 274 108 274 C 115 274 120 277 120 282 L 118 295 L 98 295 Z" fill="#ffffff" />
    <path d="M 108 300 L 122 326 L 332 326 C 352 326, 372 316, 382 290 L 356 298 L 124 298 Z" fill="#ffffff" />

    <!-- Angler -->
    <path d="M 160 298 C 154 276, 156 250, 172 234 C 182 224, 202 224, 215 236 C 228 250, 237 262, 251 265 L 261 257 C 266 260, 264 270, 253 275 L 238 278 C 230 290, 240 298, 248 298 L 230 300 L 210 295 L 185 300 Z" fill="#ffffff" />
    <circle cx="190" cy="216" r="18" fill="#ffffff" />
    <path d="M 185 206 C 195 203, 208 206, 216 213 L 203 218 Z" fill="#ffffff" />
    <path d="M 202 242 C 218 245, 238 250, 253 255 L 248 265 C 233 260, 215 255, 200 252 Z" fill="#ffffff" />

    <!-- Loaded Fishing Rod & Line -->
    <path d="M 241 262 C 256 218, 284 186, 322 182 C 352 180, 374 199, 379 220" fill="none" stroke="#f97316" stroke-width="9" stroke-linecap="round" />
    <path d="M 379 220 L 361 346" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

    <!-- Catfish -->
    <path d="M 361 346 C 345 336, 320 346, 301 364 C 288 376, 279 389, 258 394 C 266 384, 279 371, 294 358 C 313 340, 343 325, 365 330 C 376 335, 371 346, 361 346 Z" fill="#38bdf8" />
    <!-- Whiskers -->
    <path d="M 365 338 C 382 333, 395 340, 390 356" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <path d="M 361 348 C 376 351, 384 361, 379 371" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <!-- Tail -->
    <path d="M 263 392 L 242 379 L 250 395 L 237 407 L 260 400 Z" fill="#38bdf8" />
  </g>

  <!-- Left Side: Typography & Tactical Branding -->
  <g transform="translate(68, 85)">
    <!-- Top Pill Badge -->
    <g>
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#0f172a" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.8" />
      <circle cx="16" cy="14" r="5" fill="#22c55e" />
      <text x="30" y="19" fill="#fed7aa" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="800" letter-spacing="1.5">
        TACTICAL RIVER LOGGING ENGINE
      </text>
    </g>

    <!-- Main Title: LEDGEr -->
    <text x="0" y="115" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" letter-spacing="-2" filter="url(#shadowGlow)">
      LEDGE<tspan fill="#f97316">r</tspan>
    </text>

    <!-- Subtitle: Catfish Catch Log & 50-Mile Offline Map -->
    <text x="2" y="152" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17" font-weight="700" letter-spacing="1">
      50-MILE OFFLINE MAP &amp; RIVER TELEMETRY
    </text>

    <!-- Secondary Tagline Description -->
    <text x="2" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      Engineered for trophy blue, flathead &amp; channel catfishing in cellular dead zones.
    </text>

    <!-- Tactical Feature Badges Strip -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: 100% Offline First -->
      <g>
        <rect x="0" y="0" width="138" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" fill="#34d399" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700">✓ 100% OFFLINE</text>
      </g>
      <!-- Badge 2: USGS Telemetry -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="158" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700">⚡ USGS FLOW &amp; CFS</text>
      </g>
      <!-- Badge 3: Solunar Moon Clock -->
      <g transform="translate(316, 0)">
        <rect x="0" y="0" width="156" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" fill="#fb923c" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700">🌕 SOLUNAR FEEDING</text>
      </g>
    </g>

    <!-- Bottom Developer Signature -->
    <text x="2" y="325" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="600" letter-spacing="1">
      BY BIGGUY_LITTLEBOAT • GOOGLE PLAY READY
    </text>
  </g>
</svg>
